apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: it-request-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default # หรือสร้าง AppProject ใหม่

  source:
    repoURL: https://github.com/tanPiyangkoon/it-request.git # ⚠️ แก้เป็น repo URL ของคุณ
    targetRevision: production # branch name
    path: overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true # ลบ resources ที่ไม่มีใน Git
      selfHeal: true # แก้ไข resources ที่ถูกแก้ไขนอก Git
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health assessment
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  # Notifications
  # annotations:
  #   notifications.argoproj.io/subscribe.on-sync-succeeded.slack: it-request-alerts
