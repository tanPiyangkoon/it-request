services:
  backend:
    build: ./backend
    restart: always
    environment:
      - PGHOST=${PGHOST:-192.168.2.50}
      - PGUSER=${POSTGRES_USER:-it_admin}
      - PGPASSWORD=${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env file}
      - PGDATABASE=${POSTGRES_DB:-it_request_db}
      - PGPORT=${PGPORT:-5432}
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${BACKEND_PORT:-3001}
    ports:
      - "0.0.0.0:${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    image: nginx:alpine
    restart: always
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
